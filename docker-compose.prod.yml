services:
    mongo:
        image: mongo:7
        restart: unless-stopped
        volumes:
            - mongo_data:/data/db
        environment:
            MONGO_INITDB_DATABASE: recruiting
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 15s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 15s
            timeout: 3s
            retries: 5

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: production
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: production
            MONGODB_URI: mongodb://mongo:27017/recruiting
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            # This stack has a dedicated worker service.
            EMBEDDED_WORKERS: 'false'
            TRUST_PROXY: 'true'
        ports:
            - '5000:5000'
        volumes:
            - storage_data:/tmp/recruitai-storage
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -qO- http://localhost:5000/health/ready >/dev/null 2>&1 || exit 1',
                ]
            interval: 20s
            timeout: 5s
            retries: 5

    worker:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: production
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: production
            MONGODB_URI: mongodb://mongo:27017/recruiting
            REDIS_HOST: redis
            REDIS_PORT: '6379'
        volumes:
            - storage_data:/tmp/recruitai-storage
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: node dist/worker.js

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: production
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
                VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        restart: unless-stopped
        ports:
            - '80:80'
        depends_on:
            api:
                condition: service_healthy

volumes:
    mongo_data:
    redis_data:
    storage_data:
